# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Minimum permissions required for Pages deployments
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Run tests and build the Maven Surefire HTML report
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Run tests
      run: mvn -B -DskipTests=false test
    - name: Generate Surefire HTML report
      run: mvn -B surefire-report:report

    # Collect the site into a single folder (Pages will serve these files)
    - name: Prepare site folder
      run: |
        mkdir -p site
        # cp -r target/site/* site/
        cp -r target/reports/* site/
        # Optional: add a simple index redirect to the Surefire report
        if [ -f site/surefire-report.html ]; then
          printf '<meta http-equiv="refresh" content="0; url=surefire-report.html">' > site/index.html
        fi

    # Upload as the Pages artifact
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4